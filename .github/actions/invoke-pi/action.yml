name: "Invoke pi"
description: "Invoke pi and return structured response"
inputs:
  context:
    description: "Context to send to pi"
    required: true
  prompt:
    description: "Prompt to send to pi"
    required: true
  schema:
    description: "Response schema"
    required: true
outputs:
  response:
    description: "Response json formatted in schema"
    value: ${{ steps.pi-response.outputs.PI_RESPONSE }}
runs:
  using: "composite"
  steps:
    - shell: bash
      id: pi-response
      run: |
        PROMPT="Context: ${{ inputs.context }} \n\n End of context. \n\n ${{ inputs.prompt }} \n\n Use the following schema to format your response. ${{ inputs.schema }}"
        PI_RESPONSE=$(pi \
          --provider deepseek \
          --model deepseek-chat \
          --tools read,write,edit,bash,grep,find,ls \
          --print "${PROMPT}" \
          )
        echo "${PI_RESPONSE}"
        echo "PI_RESPONSE<<EOF" >> $GITHUB_OUTPUT
        echo "${PI_RESPONSE}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
