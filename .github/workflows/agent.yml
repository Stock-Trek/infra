name: Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  test:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agent')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@agent') || contains(github.event.issue.title, '@agent')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install pi-coding-agent
        run: bun install -g @mariozechner/pi-coding-agent

      - name: Configure DeepSeek as custom provider
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json << 'EOF'
          {
            "providers": {
              "deepseek": {
                "baseUrl": "https://api.deepseek.com/v1",
                "api": "openai-completions",
                "apiKey": "${{ secrets.DEEPSEEK_API_KEY }}",
                "models": [
                  { "id": "deepseek-chat" },
                  { "id": "deepseek-reasoner" }
                ],
                "hideThinkingBlock": false
              }
            }
          }
          EOF

      - name: Run DeepSeek Agent
        run: |
          pi \
            --provider deepseek \
            --model deepseek-chat \
            --tools read,write,edit,bash,grep,find,ls \
            --debug \
            --print "Implement the changes described in issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}"

      - name: Create feature branch
        id: feature
        run: |
          TIMESTAMP=$(date +'%Y-%m-%dT%H-%M-%S')
          FEATURE_BRANCH="agent/issue-${{ github.event.issue.number }}/${TIMESTAMP}"
          echo "FEATURE_BRANCH=${FEATURE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.RAISE_PR_PAT }}
          commit-message: "Feature branch for ${{ github.event.issue.number }}"
          title: "Closes #${{ github.event.issue.number }}. ${{ github.event.issue.title }}"
          body: "${{ github.event.issue.body }}"
          branch: ${{ steps.feature.outputs.FEATURE_BRANCH }}
          base: "master"
