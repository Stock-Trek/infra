name: Test

on:
  push:
    branches:
      - '!master'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            protected:
              - 'bootstrap/**'

      - name: Fail if bootstrap/ has changes
        if: steps.filter.outputs.protected == 'true'
        run: |
          echo "❌ Changes detected in src/bootstrap/"
          exit 1

      - uses: hashicorp/setup-terraform@v4

      - name: Format
        run: |
          terraform fmt -check -recursive bootstrap
          terraform fmt -check -recursive live

      - name: Init
        run: |
          terraform -chdir=bootstrap init -backend=false
          terraform -chdir=live init -backend=false

      - name: Validate
        run: |
          terraform -chdir=bootstrap validate
          terraform -chdir=live validate


      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: TFLint Init
        run: tflint --init
      - name: TFLint
        run: tflint --recursive

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: sarif

      - name: Run Terraform Tests
        run: terraform test -verbose

      - name: Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "fafecebc-b41d-496d-915f-5ce536a6644b"
          project-slug: "aws"
          env-slug: "dev"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ROLE_TERRAFORM_PLAN: ${{ env.AWS_ROLE_TERRAFORM_PLAN }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_TERRAFORM_PLAN }}"
          role-session-name: "infra-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v4

      - name: Apply
        run: |
          terraform -chdir=live init
          terraform -chdir=live plan
