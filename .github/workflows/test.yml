name: Aider test

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  test:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@aider')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@aider') || contains(github.event.issue.title, '@aider')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      
      - name: Run DeepSeek Agent
        run: |
          bunx pi \
            --provider openai-completions \
            --base-url https://api.deepseek.com/v1 \
            --model deepseek-chat \
            --api-key ${{ secrets.DEEPSEEK_API_KEY }} \
            --tools read,write,edit,bash,grep,find,ls \
            --session-key issue-${{ github.event.issue.number }} \
            --system-prompt "Implement the changes described in issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#       - name: Run Aider on Issue
#         uses: mirrajabi/aider-github-action@v1.1.0
#         with:
#           api_key_env_name: DEEPSEEK_API_KEY
#           api_key_env_value: ${{ secrets.DEEPSEEK_API_KEY }}
#           branch: master
#           model: deepseek/deepseek-chat
#           aider_args: >-
#             --yes
#             --auto-commits
#             --auto-accept-architect
#             --message "Implement the changes described in issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}"

      - name: Create feature branch
        id: feature
        run: |
          TIMESTAMP=$(date +'%Y-%m-%dT%H-%M-%S')
          AIDER_BRANCH="aider/issue-${{ github.event.issue.number }}/${TIMESTAMP}"
          echo "AIDER_BRANCH=${AIDER_BRANCH}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Feature branch for ${{ github.event.issue.number }}"
          title: "Closes #${{ github.event.issue.number }}. ${{ github.event.issue.title }}"
          body: "${{ github.event.issue.body }}"
          branch: ${{ steps.feature.outputs.AIDER_BRANCH }}
          base: "master"
