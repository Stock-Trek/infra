name: Test

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: hashicorp/setup-terraform@v4

      - name: Format
        run: |
          terraform fmt -check -recursive bootstrap
          terraform fmt -check -recursive live
          terraform fmt -check -recursive modules

      - name: Init
        run: |
          terraform -chdir=bootstrap init -backend=false
          terraform -chdir=live init -backend=false

      - name: Validate
        run: |
          terraform -chdir=bootstrap validate
          terraform -chdir=live validate
          terraform -chdir=modules validate


      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: TFLint Init
        run: tflint --init
      - name: TFLint
        run: tflint --recursive

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: sarif

      - name: Run Terraform Tests
        run: terraform test -verbose

      - name: Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "2aecd8e8-fa70-41c3-bf79-a124b5675a46"
          project-slug: "aws"
          env-slug: "dev"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ROLE_TERRAFORM_PLAN: ${{ env.AWS_ROLE_TERRAFORM_PLAN }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_TERRAFORM_PLAN }}"
          role-session-name: "infra-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v4

      - name: Plan bootstrap
        run: |
          terraform -chdir=bootstrap init
          terraform -chdir=bootstrap plan

      - name: Plan live
        run: |
          terraform -chdir=live init
          terraform -chdir=live plan
