name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Prevent multiple deploys at the same time
concurrency:
  group: ${{ github.event.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "fafecebc-b41d-496d-915f-5ce536a6644b"
          project-slug: "aws"
          env-slug: "prod"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ROLE_TERRAFORM_APPLY: ${{ env.AWS_ROLE_TERRAFORM_APPLY }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_TERRAFORM_APPLY }}"
          role-session-name: "infra-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v4

      - name: Apply bootstrap
        run: |
          terraform -chdir=bootstrap init
          terraform -chdir=bootstrap apply -auto-approve

      - name: Apply live
        run: |
          terraform -chdir=live init
          terraform -chdir=live apply -auto-approve
