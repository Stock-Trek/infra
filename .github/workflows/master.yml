name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Prevent multiple deploys at the same time
concurrency:
  group: ${{ github.event.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: hashicorp/setup-terraform@v4

      - name: Apply
        run: |
          terraform -chdir=live init
          terraform -chdir=live apply -auto-approve
