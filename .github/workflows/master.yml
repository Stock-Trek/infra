name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: hashicorp/setup-terraform@v4

      - name: Apply
        run: |
          terraform -chdir=live init -backend=false
          terraform -chdir=live apply -y
